# Development override for docker-compose
# Use with: docker-compose -f docker-compose.yml -f docker-compose.override.yml up

version: '3.8'

services:
  web-backend:
    environment:
      - RUST_LOG=debug  # More verbose logging in dev
      - RUST_BACKTRACE=1
    volumes:
      - ./web-backend/src:/usr/src/app/web-backend/src:ro  # Live code reloading
      - ./alphabet-terminal-prototype/src:/usr/src/app/alphabet-terminal-prototype/src:ro
    command: ["cargo", "watch", "-x", "run"]  # Auto-reload on changes
    stdin_open: true
    tty: true

  xilem-app:
    environment:
      - RUST_LOG=debug
      - RUST_BACKTRACE=1
    volumes:
      - ./xilem-cross-platform/app/src:/usr/src/app/xilem-cross-platform/app/src:ro
      - ./alphabet-terminal-prototype/src:/usr/src/app/alphabet-terminal-prototype/src:ro
    stdin_open: true
    tty: true

  python-client:
    environment:
      - JUPYTER_ENABLE_LAB=yes
    volumes:
      - ./python-client/src:/app/src:ro  # Live code reloading
      - ./notebooks:/app/notebooks
      - ./analysis:/app/analysis:ro
    command: ["jupyter", "lab", "--ip=0.0.0.0", "--port=8888", "--no-browser", "--allow-root", "--NotebookApp.token=dev", "--debug"]

  # Development database with data persistence
  postgres:
    profiles: ["dev", "postgres"]  # Enable postgres in dev
    ports:
      - "5432:5432"  # Expose postgres port in dev

  # Development Redis
  redis:
    profiles: ["dev", "cache"]
    ports:
      - "6379:6379"  # Expose redis port in dev

# Development-specific volumes
volumes:
  # Use bind mounts for faster development iteration
  backend_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./dev-data/backend
  notebooks:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./dev-data/notebooks