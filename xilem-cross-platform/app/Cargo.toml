[package]
name = "graph_learning_app"
edition.workspace = true

[dependencies]
pollster = "0.3.0"
winit = { version = "0.30.12", features = ["android-native-activity"] }
# iOS support is not released yet, requires 1daf711
masonry = "0.3.0"
xilem = "0.3.0"

# Additional dependencies for the learning app
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
reqwest = { version = "0.12", features = ["json", "blocking"] }
tokio = { version = "1.0", features = ["rt-multi-thread", "macros"] }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
rand = "0.8"

# Include the alphabet-terminal-prototype library
graph-learning-core = { path = "../../alphabet-terminal-prototype", package = "graph-learning-core" }

# Visualization dependencies
plotters = { version = "0.3", default-features = false, features = [
    "bitmap_backend",
    "bitmap_encoder",
    "chrono",
] }
image = "0.24"
imageproc = "0.23"
rusttype = "0.9"
once_cell = "1.19"

# Offline storage dependencies
rusqlite = { version = "0.31", features = ["bundled", "chrono", "serde_json"] }
async-trait = "0.1"
thiserror = "1.0"
tempfile = "3.8"

# Cloud sync and gamification
dirs = "5.0"

# Configuration management
toml = "0.8"
url = "2.5"

# Audio recording dependencies
cpal = "0.15"
hound = "3.5"  # For WAV file writing
ringbuf = "0.3"  # For audio buffering
