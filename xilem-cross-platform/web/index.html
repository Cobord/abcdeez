<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABCDEEZ Learning System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        h1, h2, h3 {
            color: #2d3748;
            margin-bottom: 16px;
        }

        .button {
            display: inline-block;
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.2s;
            margin: 5px;
        }

        .button:hover {
            background: #5a67d8;
        }

        .button.secondary {
            background: #48bb78;
        }

        .button.secondary:hover {
            background: #38a169;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .metrics {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .metric-card {
            background: #f7fafc;
            padding: 16px;
            border-radius: 8px;
            text-align: center;
        }

        .metric-value {
            font-size: 32px;
            font-weight: bold;
            color: #667eea;
        }

        .metric-label {
            font-size: 14px;
            color: #718096;
            margin-top: 8px;
        }

        .progress-bar {
            width: 100%;
            height: 20px;
            background: #e2e8f0;
            border-radius: 10px;
            overflow: hidden;
            margin: 10px 0;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            transition: width 0.3s ease;
        }

        .progress {
            margin-top: 20px;
        }

        .task-display {
            font-size: 48px;
            text-align: center;
            padding: 40px;
            background: #edf2f7;
            border-radius: 8px;
            margin: 20px 0;
            min-height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .response-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(50px, 1fr));
            gap: 10px;
            margin: 20px 0;
        }

        .response-btn {
            padding: 15px;
            font-size: 20px;
            font-weight: bold;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .response-btn:hover {
            background: #5a67d8;
            transform: translateY(-2px);
        }

        .domain-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }

        .domain-card {
            padding: 20px;
            background: #f7fafc;
            border: 2px solid transparent;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .domain-card:hover {
            border-color: #667eea;
            transform: translateY(-2px);
        }

        .domain-card h3 {
            margin-bottom: 8px;
        }

        .domain-card p {
            color: #718096;
            font-size: 14px;
        }

        /* Loading state */
        #loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: white;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }
            
            .task-display {
                font-size: 32px;
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <!-- App root element for xilem-web -->
    <div id="app">
        <div id="loading">
            <div class="spinner"></div>
            <h2 style="margin-top: 20px;">Loading ABCDEEZ...</h2>
        </div>
    </div>
    
    <script type="module">
        import init, { run_web } from './abcdeez.js';
        
        // Register service worker with update handling
        async function registerServiceWorker() {
            if ('serviceWorker' in navigator) {
                try {
                    const registration = await navigator.serviceWorker.register('./service-worker.js');
                    console.log('Service Worker registered:', registration);
                    
                    // Check for updates on page load
                    registration.update();
                    
                    // Listen for new service worker activation
                    registration.addEventListener('updatefound', () => {
                        const newWorker = registration.installing;
                        newWorker.addEventListener('statechange', () => {
                            if (newWorker.state === 'activated') {
                                // New service worker activated, show update prompt
                                if (confirm('New version available! Reload to update?')) {
                                    window.location.reload();
                                }
                            }
                        });
                    });
                } catch (error) {
                    console.error('Service Worker registration failed:', error);
                }
            }
        }
        
        async function run() {
            // Register service worker
            await registerServiceWorker();
            
            // Initialize WASM
            await init();
            
            // The start function will be called automatically by wasm-bindgen
            // If not, we can manually call run_web()
            // run_web();
            
            // Hide loading screen
            document.getElementById('loading').style.display = 'none';
        }
        
        run();
    </script>
</body>
</html>
