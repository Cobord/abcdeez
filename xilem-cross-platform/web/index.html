<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABCDEEZ Learning System</title>
    <link rel="stylesheet" href="./styles.css">
    <style>
        /* Loading state override - keep this for initial load */
        #loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: white;
        }
        
        #loading .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
        }
    </style>
</head>
<body>
    <!-- App root element for xilem-web -->
    <div id="app">
        <div id="loading">
            <div class="spinner"></div>
            <h2 style="margin-top: 20px;">Loading ABCDEEZ...</h2>
        </div>
    </div>
    
    <script type="module">
        import init, { run_web } from './abcdeez.js';
        
        // Register service worker with update handling
        async function registerServiceWorker() {
            if ('serviceWorker' in navigator) {
                try {
                    const registration = await navigator.serviceWorker.register('./service-worker.js');
                    console.log('Service Worker registered:', registration);
                    
                    // Check for updates on page load
                    registration.update();
                    
                    // Listen for new service worker activation
                    registration.addEventListener('updatefound', () => {
                        const newWorker = registration.installing;
                        newWorker.addEventListener('statechange', () => {
                            if (newWorker.state === 'activated') {
                                // New service worker activated, show update prompt
                                if (confirm('New version available! Reload to update?')) {
                                    window.location.reload();
                                }
                            }
                        });
                    });
                } catch (error) {
                    console.error('Service Worker registration failed:', error);
                }
            }
        }
        
        async function run() {
            // Register service worker
            await registerServiceWorker();
            
            // Initialize WASM
            await init();
            
            // The start function will be called automatically by wasm-bindgen
            // If not, we can manually call run_web()
            // run_web();
            
            // Hide loading screen
            document.getElementById('loading').style.display = 'none';
        }
        
        run();
    </script>
</body>
</html>
