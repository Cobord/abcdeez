[package]
name = "abcdeez-web"
version.workspace = true
publish = false
edition = "2021"

[features]
default = []
wee_alloc = ["dep:wee_alloc"]

[lib]
crate-type = ["cdylib"]

[dependencies]
# Core library
abcdeez-core = { path = "../../core" }
abcdeez-app = { path = "../../xilem-app", default-features = false, features = ["web"] }

# Xilem web
xilem_web = "0.3.0"
xilem_core = "0.3.0"

# Override tokio for WASM compatibility (no networking or runtime features)
tokio = { version = "1.0", default-features = false, features = ["sync", "macros"] }

# Web platform
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Document",
    "Element",
    "HtmlElement",
    "HtmlButtonElement",
    "HtmlDivElement",
    "HtmlInputElement",
    "Window",
    "Storage",
    "Event",
    "MouseEvent",
    "console",
    "Navigator",
    "ServiceWorker",
    "ServiceWorkerContainer",
    "ServiceWorkerRegistration",
    "PushManager",
    "PushSubscription",
    "Notification",
    "NotificationPermission",
    "MessageEvent",
    "BroadcastChannel",
    "NetworkInformation",
    "ConnectionType"
] }
console_error_panic_hook = "0.1"
tracing-wasm = "0.2"
wee_alloc = { version = "0.4", optional = true }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Utils
js-sys = "0.3"
getrandom = { version = "0.2", features = ["js"] }
uuid = { version = "1.0", features = ["v4", "js", "serde"] }
