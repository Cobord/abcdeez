[target.aarch64-apple-ios]
rustflags = ["-C", "link-arg=-framework", "-C", "link-arg=CoreFoundation", "-C", "link-arg=-framework", "-C", "link-arg=Security"]

[target.aarch64-apple-ios-sim]
rustflags = ["-C", "link-arg=-framework", "-C", "link-arg=CoreFoundation", "-C", "link-arg=-framework", "-C", "link-arg=Security"]

[target.x86_64-apple-ios]
rustflags = ["-C", "link-arg=-framework", "-C", "link-arg=CoreFoundation", "-C", "link-arg=-framework", "-C", "link-arg=Security"]

# Disable SQLx compile-time verification for iOS builds
[env]
SQLX_OFFLINE = "true"
# Ensure cc-based crates (e.g., ring) use valid clang target for iOS Simulator
CFLAGS_aarch64_apple_ios_sim = "-target arm64-apple-ios-simulator -mios-simulator-version-min=12.0"

# Use vendored OpenSSL for iOS
[target.'cfg(target_os = "ios")']
rustflags = ["-C", "link-arg=-lsqlite3"]