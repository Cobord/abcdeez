[package]
name = "graph-learning-core"
version = { workspace = true }
edition = { workspace = true }
authors = { workspace = true }
license = { workspace = true }

[lib]
name = "graph_learning_core"
path = "src/lib.rs"

[[bin]]
name = "graph-learning-cli"
path = "src/main.rs"

[[bin]]
name = "test_implementation"
path = "src/bin/test_implementation.rs"

[[bin]]
name = "mock_backend"
path = "src/bin/mock_backend.rs"
required-features = ["backend-server"]

[dependencies]
crossterm = { version = "0.27", optional = true }
ratatui = { version = "0.26", optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
rand = { workspace = true }
rand_distr = { workspace = true }
chrono = { workspace = true }
statrs = { workspace = true }
uuid = { workspace = true }
tokio = { workspace = true, optional = true, features = ["sync", "time", "rt-multi-thread", "macros"] }
tracing = { workspace = true }
anyhow = "1.0"
reqwest = { version = "0.11", features = ["blocking", "json"] }
toml = "0.8"
axum = { version = "0.7", optional = true }

[dev-dependencies]
proptest = "1.0"
criterion = "0.5"

[features]
default = ["cli"]
cli = ["crossterm", "ratatui"]
async = ["tokio"]
backend-server = ["tokio", "axum"]
