[package]
name = "graph-learning-core"
version = { workspace = true }
edition = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
description = "Adaptive graph-coded learning system for cognitive modeling"
repository = "https://github.com/emberian/abcdeez"
homepage = "https://abcdeez.fg-goose.online"
readme = "../README.md"

[lib]
name = "graph_learning_core"
path = "src/lib.rs"

[[bin]]
name = "graph-learning-cli"
path = "src/main.rs"

[[bin]]
name = "test_implementation"
path = "src/bin/test_implementation.rs"

[[bin]]
name = "mock_backend"
path = "src/bin/mock_backend.rs"
required-features = ["backend-server"]

[[bin]]
name = "research_dashboard_demo"
path = "src/bin/research_dashboard_demo.rs"
required-features = ["cli"]

[[bin]]
name = "research_backend"
path = "src/bin/research_backend.rs"
required-features = ["backend-server"]

# Package metadata for distribution
[package.metadata.dist]
# Specify this package should be distributed
dist = true

[package.metadata.dist.dependencies.apt]
# Dependencies for Debian/Ubuntu
libc6 = "*"
libssl3 = "*"

[package.metadata.dist.dependencies.yum]
# Dependencies for RHEL/Fedora
glibc = "*"
openssl = "*"

[package.metadata.wix]
upgrade-guid = "93FBBB59-DB19-4C70-9C2C-7E79E4549998"
path-guid = "25613094-4E7F-4EEA-9167-41101F8C2A45"
license = false
eula = false

[dependencies]
crossterm = { version = "0.27", optional = true }
ratatui = { version = "0.26", optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = "0.9"
rand = { workspace = true }
rand_distr = { workspace = true }
chrono = { workspace = true }
statrs = { workspace = true }
uuid = { workspace = true }
tokio = { workspace = true, optional = true, features = ["sync", "time", "rt-multi-thread", "macros", "test-util"] }
tracing = { workspace = true }
anyhow = "1.0"
reqwest = { version = "0.11", features = ["blocking", "json"] }
toml = "0.8"
axum = { version = "0.7", optional = true }
sha2 = "0.10"
md5 = "0.7"
tempfile = "3.8"

[dev-dependencies]
proptest = "1.0"
criterion = "0.5"

[features]
default = ["cli", "async"]
cli = ["crossterm", "ratatui"]
async = ["tokio"]
backend-server = ["tokio", "axum"]
