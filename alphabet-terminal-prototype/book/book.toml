[book]
authors = ["Ember Arlynx"]
language = "en"
multilingual = false
src = "src"
title = "Alphabet Terminal Prototype: Mathematical Foundations and Implementation"

[build]
build-dir = "build"

[preprocessor.katex]
after = ["links"]

[output.html]
#theme = "rust"
#default-theme = "rust"
preferred-dark-theme = "navy"
mathjax-support = true
git-repository-url = "https://github.com/emberian/abcdeez"
edit-url-template = "https://github.com/emberian/abcdeez/edit/main/alphabet-terminal-prototype/book/{path}"

[output.html.playground]
editable = true
copyable = true

[output.html.search]
enable = true
limit-results = 30
teaser-word-count = 30
use-boolean-and = true
boost-title = 2
boost-hierarchy = 1
boost-paragraph = 1
expand = true
heading-split-level = 3
copy-js = true
