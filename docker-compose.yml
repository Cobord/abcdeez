version: '3.8'

services:
  # Web Backend API
  web-backend:
    build:
      context: .
      dockerfile: Dockerfile.web-backend
    container_name: research-web-backend
    ports:
      - "8080:8080"
    environment:
      - RUST_LOG=info
      - DATABASE_URL=sqlite:///app/data/research.db
      - BIND_ADDRESS=0.0.0.0:8080
      - JWT_SECRET=your-super-secret-jwt-key-change-in-production
    volumes:
      - backend_data:/app/data
      - ./web-backend/migrations:/app/migrations:ro
    networks:
      - research_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Xilem Cross-Platform App (Headless with VNC)
  xilem-app:
    build:
      context: .
      dockerfile: Dockerfile.xilem-app
    container_name: research-xilem-app
    ports:
      - "5900:5900"  # VNC port for GUI access
    environment:
      - RUST_LOG=info
      - DISPLAY=:99
      - API_BASE_URL=http://web-backend:8080
    volumes:
      - app_data:/app/data
      - audio_recordings:/app/audio_recordings
      - irb_documents:/app/irb_documents
    networks:
      - research_network
    restart: unless-stopped
    depends_on:
      web-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pgrep", "xilem-app"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Python Analysis Client with Jupyter Lab
  python-client:
    build:
      context: .
      dockerfile: Dockerfile.python-client
    container_name: research-python-client
    ports:
      - "8888:8888"  # Jupyter Lab
    environment:
      - API_BASE_URL=http://web-backend:8080
    volumes:
      - notebooks:/app/notebooks
      - analysis_data:/app/data
    networks:
      - research_network
    restart: unless-stopped
    depends_on:
      web-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import abcdeez; print('OK')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # PostgreSQL Database (Alternative to SQLite for production)
  postgres:
    image: postgres:15-alpine
    container_name: research-postgres
    environment:
      - POSTGRES_DB=research
      - POSTGRES_USER=research_user
      - POSTGRES_PASSWORD=research_password_change_me
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./web-backend/migrations-postgres:/docker-entrypoint-initdb.d:ro
    networks:
      - research_network
    restart: unless-stopped
    profiles: ["postgres"]  # Only start when explicitly requested
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U research_user -d research"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for Caching and Session Storage
  redis:
    image: redis:7-alpine
    container_name: research-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - research_network
    restart: unless-stopped
    profiles: ["cache"]  # Optional service
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # Nginx Reverse Proxy
  nginx:
    image: nginx:1.25-alpine
    container_name: research-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/ssl:ro
    networks:
      - research_network
    restart: unless-stopped
    depends_on:
      - web-backend
      - python-client
    profiles: ["production"]  # Only for production deployment

  # Monitoring with Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: research-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
    networks:
      - research_network
    restart: unless-stopped
    profiles: ["monitoring"]

  # Grafana for Visualization
  grafana:
    image: grafana/grafana:latest
    container_name: research-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin_change_me
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - research_network
    restart: unless-stopped
    depends_on:
      - prometheus
    profiles: ["monitoring"]

volumes:
  backend_data:
    driver: local
  app_data:
    driver: local
  audio_recordings:
    driver: local
  irb_documents:
    driver: local
  notebooks:
    driver: local
  analysis_data:
    driver: local
  postgres_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  research_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16