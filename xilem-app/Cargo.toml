[package]
name = "abcdeez-app"
edition.workspace = true

[dependencies]
pollster = "0.3.0"
winit = { version = "0.30.12", features = ["android-native-activity"] }
xilem   = { git = "https://github.com/linebender/xilem.git", rev = "1abde1bd97ef27c497e55e411422c582ab32f020" }
xilem_core = { git = "https://github.com/linebender/xilem.git", rev = "1abde1bd97ef27c497e55e411422c582ab32f020" }
masonry = { git = "https://github.com/linebender/xilem.git", rev = "1abde1bd97ef27c497e55e411422c582ab32f020" }
masonry_winit = { git = "https://github.com/linebender/xilem.git", rev = "1abde1bd97ef27c497e55e411422c582ab32f020" }

# Additional dependencies for the learning app
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
reqwest = { version = "0.12", features = ["json", "blocking"] }
tokio = { version = "1.0", features = ["rt-multi-thread", "macros"] }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
rand = "0.9"

# Include the core library
abcdeez-core = { path = "../core" }

# Visualization dependencies
plotters = { version = "0.3", default-features = false, features = [
    "bitmap_backend",
    "bitmap_encoder",
    "chrono",
] }
image = "0.25"
imageproc = "0.25"
rusttype = "0.9"
once_cell = "1.19"

# Offline storage dependencies
rusqlite = { version = "0.37", features = ["bundled", "chrono", "serde_json"] }
async-trait = "0.1"
thiserror = "2.0"
tempfile = "3.9"

# Cloud sync and gamification
dirs = "6.0"

# Configuration management
toml = "0.9"
url = "2.5"

# Audio recording dependencies
cpal = "0.16"
hound = "3.5"  # For WAV file writing
ringbuf = "0.4"  # For audio buffering
