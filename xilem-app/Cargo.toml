[package]
name = "abcdeez-app"
edition.workspace = true

[features]
default = ["desktop", "xilem-native"]
embed-backend = ["dep:web-backend", "tokio-runtime"]
desktop = ["websocket", "tokio-runtime", "audio", "storage"]
web = ["xilem-web"]
xilem-native = ["dep:xilem", "dep:xilem_core", "dep:masonry", "dep:masonry_winit", "dep:winit"]
xilem-web = ["dep:xilem_web", "dep:wasm-bindgen", "dep:web-sys", "tracing-wasm", "console_error_panic_hook", "wasm-bindgen-futures"]
websocket = ["dep:tokio-tungstenite", "dep:futures-util"]
tokio-runtime = ["dep:tokio", "dep:reqwest", "dep:async-trait"]
audio = ["dep:cpal", "dep:hound", "dep:ringbuf"]
storage = ["dep:rusqlite", "dep:tempfile"]

[dependencies]
pollster = "0.3.0"

# Native dependencies (xilem)
winit = { version = "0.30.12", features = ["android-native-activity"], optional = true }
xilem   = { git = "https://github.com/linebender/xilem.git", optional = true }
xilem_core = { git = "https://github.com/linebender/xilem.git", optional = true }
masonry = { git = "https://github.com/linebender/xilem.git", optional = true }
masonry_winit = { git = "https://github.com/linebender/xilem.git", optional = true }

# Web dependencies (xilem_web)
xilem_web = { version = "0.3.0", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
web-sys = { version = "0.3", features = ["Document", "Element", "HtmlElement", "console", "Window", "Location", "History", "Event", "EventTarget"], optional = true }

# Additional dependencies for the learning app
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"], optional = true }
tokio = { version = "1.0", default-features = false, features = ["rt", "macros", "sync", "time"], optional = true }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
rand = "0.8"

# Include the core library
abcdeez-core = { path = "../core" }
web-backend = { path = "../web-backend", default-features = false, features = ["sqlite"], optional = true }

# Visualization dependencies
plotters = { version = "0.3", default-features = false, features = [
    "bitmap_backend",
    "bitmap_encoder",
    "chrono",
] }
image = "0.25"
imageproc = "0.25"
rusttype = "0.9"
once_cell = "1.19"
base64 = "0.22"

# Offline storage dependencies
rusqlite = { version = "0.32", features = ["bundled", "chrono", "serde_json"], optional = true }
async-trait = { version = "0.1", optional = true }
thiserror = "2.0"
tempfile = { version = "3.9", optional = true }

# Cloud sync and gamification
dirs = "6.0"

# Configuration management
toml = "0.9"
url = "2.5"

# Audio recording dependencies
cpal = { version = "0.16", optional = true }
hound = { version = "3.5", optional = true }  # For WAV file writing
ringbuf = { version = "0.4", optional = true }  # For audio buffering

# WebSocket dependencies
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "__rustls-tls"], optional = true }
futures-util = { version = "0.3", optional = true }

# WASM dependencies required by masonry
[target.'cfg(target_arch = "wasm32")'.dependencies]
tracing-wasm = { version = "0.2", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
