# Nginx configuration for Research Platform
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    # Basic settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=jupyter:10m rate=2r/s;

    # SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload";
    add_header Referrer-Policy strict-origin-when-cross-origin;

    # Upstream servers
    upstream web_backend {
        server web-backend:8080;
        keepalive 32;
    }

    upstream jupyter_server {
        server python-client:8888;
        keepalive 8;
    }

    # Main server configuration
    server {
        listen 80;
        server_name localhost research.local;
        
        # Redirect HTTP to HTTPS in production
        # return 301 https://$server_name$request_uri;

        # Development: serve HTTP directly
        root /var/www/html;
        index index.html;

        # Health check endpoint
        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # API backend
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            
            proxy_pass http://web_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            
            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            # Buffer settings
            proxy_buffering on;
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;
        }

        # Jupyter Lab interface
        location /jupyter/ {
            limit_req zone=jupyter burst=10 nodelay;
            
            proxy_pass http://jupyter_server/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            
            # WebSocket support for Jupyter
            proxy_set_header Origin $scheme://$host;
            proxy_read_timeout 86400;
        }

        # Static files for documentation
        location /docs/ {
            alias /var/www/docs/;
            expires 1h;
            add_header Cache-Control "public, immutable";
        }

        # File download endpoint
        location /downloads/ {
            alias /var/www/downloads/;
            expires 1h;
            add_header Content-Disposition attachment;
        }

        # Default route
        location / {
            try_files $uri $uri/ =404;
        }

        # Security: block access to hidden files
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }

    # HTTPS server (uncomment for production with SSL certificates)
    # server {
    #     listen 443 ssl http2;
    #     server_name research.local;
    #     
    #     ssl_certificate /etc/ssl/certs/research.crt;
    #     ssl_certificate_key /etc/ssl/private/research.key;
    #     
    #     # Same configuration as HTTP server but with SSL
    #     # ... (copy location blocks from above)
    # }

    # VNC access for Xilem app (development only)
    server {
        listen 5900;
        proxy_pass xilem-app:5900;
        proxy_timeout 1s;
        proxy_responses 1;
    }
}