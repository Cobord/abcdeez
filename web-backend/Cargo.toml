[package]
name = "web-backend"
version = { workspace = true }
edition = { workspace = true }
authors = { workspace = true }
license = { workspace = true }

[features]
default = ["sqlite"]
sqlite = ["sqlx/sqlite"]
postgres = ["sqlx/postgres"]

[dependencies]
# Core library
graph-learning-core = { path = "../alphabet-terminal-prototype" }

# Web framework
axum = { version = "0.7", features = ["ws", "macros"] }
axum-extra = { version = "0.9", features = ["cookie", "typed-header"] }
tower = { version = "0.5", features = ["util", "timeout"] }
tower-http = { version = "0.6", features = ["cors", "compression-gzip", "trace"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "uuid", "chrono", "json"] }

# Async runtime
tokio = { workspace = true, features = ["full"] }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Authentication & Security
jsonwebtoken = "9.3"
argon2 = "0.5"
rand = { workspace = true }
regex = "1.10"

# Apple Sign In
# apple-signin = "0.4"  # Temporarily disabled - version not found
base64 = "0.22"

# UUID and Time
uuid = { workspace = true, features = ["v4", "serde"] }
chrono = { workspace = true }

# WebSocket
tokio-tungstenite = "0.24"
futures-util = "0.3"

# Redis cache
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }

# Logging & Monitoring
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
opentelemetry = { version = "0.27", features = ["trace"] }
opentelemetry-otlp = "0.27"
prometheus = "0.13"
once_cell = "1.19"

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# HTTP client (for external APIs)
reqwest = { version = "0.12", features = ["json"] }
url = "2.5"
urlencoding = "2.1"

# Environment variables
dotenvy = "0.15"

# Differential privacy and statistics
statrs = { workspace = true }
rand_distr = "0.4"

# Cryptography
sha2 = "0.10"

# TLS/SSL with automatic Let's Encrypt
rustls = "0.23"
rustls-pemfile = "2.1"
tokio-rustls = "0.26"
rcgen = "0.13"  # For self-signed certificate generation
instant-acme = "0.7"  # Let's Encrypt ACME client
