[package]
name = "web-backend"
version = { workspace = true }
edition = { workspace = true }
authors = { workspace = true }
license = { workspace = true }

[package.metadata.wix]
upgrade-guid = "36712322-67A0-456E-8888-21986D7CE8D2"
path-guid = "8309AEAE-A932-484E-8DEE-2B375E29DCA7"
license = false
eula = false

[features]
default = ["sqlite", "tls"]
sqlite = ["sqlx/sqlite"]
postgres = ["sqlx/postgres"]
runtime-multi-db = ["sqlite", "postgres"]  # Enable both for runtime selection
tls = [
    "dep:rustls",
    "dep:rustls-pemfile",
    "dep:tokio-rustls",
    "dep:rcgen",
    "dep:instant-acme",
    "dep:aws-lc-sys",
]

[dependencies]
# Core library
abcdeez-core = { path = "../core" }
semver = "1"

# Web framework
axum = { version = "0.8", features = ["ws", "macros"] }
axum-extra = { version = "0.10", features = ["cookie", "typed-header"] }
tower = { version = "0.5", features = ["util", "timeout"] }
tower-http = { version = "0.6", features = [
    "cors",
    "compression-gzip",
    "trace",
] }

# Database
sqlx = { version = "0.8", features = [
    "runtime-tokio-rustls",
    "uuid",
    "chrono",
    "json",
] }

# Async runtime
tokio = { workspace = true, features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Authentication & Security
jsonwebtoken = "9.3"
argon2 = "0.5"
aes-gcm = "0.10"
base64 = "0.22"
rand = { workspace = true }
regex = "1.10"

# Apple Sign In
apple-signin = "0.1.1"

# UUID and Time
uuid = { workspace = true, features = ["v4", "serde"] }
chrono = { workspace = true }

# WebSocket
tokio-tungstenite = "0.27"
futures-util = "0.3"

# Redis cache
redis = { version = "0.32", features = ["tokio-comp", "connection-manager"] }

# Logging & Monitoring
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
opentelemetry = { version = "0.30", features = ["trace"] }
opentelemetry-otlp = "0.30"
prometheus = "0.14"
once_cell = "1.19"
hostname = "0.4"

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# HTTP client (for external APIs)
reqwest = { version = "0.12", features = ["json"] }
url = "2.5"
urlencoding = "2.1"

# Environment variables
dotenvy = "0.15"

# Differential privacy and statistics
statrs = { workspace = true }
rand_distr = "0.4"

# Cryptography
sha2 = "0.10"

# TLS/SSL with automatic Let's Encrypt (optional via feature = "tls")
rustls = { version = "0.23", optional = true }
rustls-pemfile = { version = "2.1", optional = true }
tokio-rustls = { version = "0.26", optional = true }
rcgen = { version = "0.14", optional = true }        # For self-signed certificate generation
instant-acme = { version = "0.8", optional = true }  # Let's Encrypt ACME client
aws-lc-sys = { version = "0.30.0", features = ["bindgen"], optional = true }
