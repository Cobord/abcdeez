[workspace]
members = [
    "core",
    "web-backend",
    "xilem-app",
    "xilem-cross-platform/desktop",
    "xilem-cross-platform/mobile",
    "xilem-cross-platform/web",
]
resolver = "2"

[workspace.package]
version = "0.0.7"
edition = "2021"
authors = ["ember arlynx <ember@lunar.town>"]
license = "MIT OR Apache-2.0"
description = "Adaptive graph-coded learning system for cognitive modeling"
repository = "https://github.com/emberian/abcdeez"
homepage = "https://abcdeez.fg-goose.online"
readme = "README.md"

[workspace.dependencies]
# Core dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
rand = "0.8"
rand_distr = "0.4"
statrs = "0.18"

# GUI
winit = { version = "0.30.12", features = ["android-native-activity"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
