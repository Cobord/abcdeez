[package]
name = "alphabet-terminal-prototype"
version = "0.1.0"
edition = "2021"

[dependencies]
crossterm = "0.27"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
rand_distr = "0.4"
chrono = { version = "0.4", features = ["serde"] }
statrs = "0.17"
uuid = { version = "1.6", features = ["v4", "serde"] }
