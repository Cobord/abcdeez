[workspace]
members = [
    "alphabet-terminal-prototype",
    "web-backend",
    "xilem-cross-platform/app",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Graph Learning Research"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Core dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
rand = "0.8"
rand_distr = "0.4"
statrs = "0.17"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Config for 'cargo dist'
[workspace.metadata.dist]
# The preferred cargo-dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.0.4"
# CI backends to support
ci = ["github"]
# The installers to generate for each app
installers = [
    "shell",
    "powershell"
]
# Target platforms to build apps for (Rust target-triple syntax)
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "aarch64-apple-darwin",
    "aarch64-unknown-linux-gnu",
    "aarch64-unknown-linux-musl",
    "aarch64-pc-windows-msvc"
]
# Enable additional release artifacts
unix-archive = ".tar.gz"
windows-archive = ".zip"
# Enable updater
install-updater = true
# Build universal macOS binaries
merge-tasks = true
# Publish to homebrew tap
homebrew-tap = "yourusername/homebrew-tap"
# NPM scope for npm installer
npm-scope = "@yourusername"

# The profile that 'cargo dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
strip = true
opt-level = "z"
codegen-units = 1

