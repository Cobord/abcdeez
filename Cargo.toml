[workspace]
members = [
    "alphabet-terminal-prototype",
    "web-backend",
    "xilem-cross-platform/app",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["ember arlynx <ember@lunar.town>"]
license = "MIT OR Apache-2.0"
description = "Adaptive graph-coded learning system for cognitive modeling"
repository = "https://github.com/emberian/abcdeez"
homepage = "https://abcdeez.fg-goose.online"
readme = "README.md"

[workspace.dependencies]
# Core dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
rand = "0.8"
rand_distr = "0.4"
statrs = "0.17"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# The profile that 'cargo dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
strip = true
opt-level = "z"
codegen-units = 1

