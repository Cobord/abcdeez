name: Deploy Books to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'alphabet-terminal-prototype/book/**'
      - 'xilem-cross-platform/user-manual/**'
      - '.github/workflows/book-simple.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  TECHNICAL_BOOK_DIR: alphabet-terminal-prototype/book
  USER_MANUAL_DIR: xilem-cross-platform/user-manual

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Setup mdBook
        run: |
          curl --proto '=https' --tlsv1.2 -sSf -y https://sh.rustup.rs | sh
          cargo install mdbook --version 0.4.40
          cargo install mdbook-katex --version 0.5.10

      - name: Build book
        run: |
          cd ${{ env.BOOK_DIR }}
          mdbook build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.BOOK_DIR }}/build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4