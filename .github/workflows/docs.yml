name: Docs (mdBook)

on:
  workflow_dispatch:
  push:
    branches: [ main, dev ]
    paths:
      - 'xilem-cross-platform/user-manual/**'
      - 'admin-manual/**'
      - 'dev-manual/**'
      - '.github/workflows/docs.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup mdBook
        uses: peaceiris/actions-mdbook@v1
        with:
          mdbook-version: 'latest'

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Create documentation site structure
        run: |
          mkdir -p docs-site
          
          # Create main index page
          cat > docs-site/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Graph Learning System Documentation</title>
              <style>
                  body {
                      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
                      max-width: 1200px;
                      margin: 0 auto;
                      padding: 2rem;
                      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                      color: #333;
                      min-height: 100vh;
                  }
                  .container {
                      background: white;
                      border-radius: 12px;
                      padding: 3rem;
                      box-shadow: 0 20px 40px rgba(0,0,0,0.1);
                  }
                  h1 {
                      color: #2c3e50;
                      text-align: center;
                      margin-bottom: 3rem;
                      font-size: 2.5rem;
                  }
                  .docs-grid {
                      display: grid;
                      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
                      gap: 2rem;
                      margin: 3rem 0;
                  }
                  .doc-card {
                      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
                      border-radius: 8px;
                      padding: 2rem;
                      text-decoration: none;
                      color: #2c3e50;
                      transition: transform 0.3s ease, box-shadow 0.3s ease;
                      border: 1px solid #e1e8ed;
                  }
                  .doc-card:hover {
                      transform: translateY(-5px);
                      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
                      text-decoration: none;
                      color: #2c3e50;
                  }
                  .doc-card h2 {
                      margin-top: 0;
                      margin-bottom: 1rem;
                      color: #34495e;
                  }
                  .doc-card p {
                      margin-bottom: 0;
                      color: #5a6c7d;
                      line-height: 1.6;
                  }
                  .doc-icon {
                      font-size: 2rem;
                      margin-bottom: 1rem;
                      display: block;
                  }
                  .footer {
                      text-align: center;
                      margin-top: 3rem;
                      padding-top: 2rem;
                      border-top: 1px solid #e1e8ed;
                      color: #7f8c8d;
                  }
                  .oauth-badge {
                      display: inline-block;
                      background: linear-gradient(45deg, #4CAF50, #45a049);
                      color: white;
                      padding: 0.5rem 1rem;
                      border-radius: 20px;
                      font-size: 0.9rem;
                      font-weight: bold;
                      margin: 1rem 0;
                  }
              </style>
          </head>
          <body>
              <div class="container">
                  <h1>📚 Graph Learning System Documentation</h1>
                  
                  <div class="oauth-badge">✨ Now with Apple Sign In & GitHub OAuth Authentication!</div>
                  
                  <p style="text-align: center; font-size: 1.2rem; color: #5a6c7d; margin-bottom: 2rem;">
                      Comprehensive documentation for users, administrators, and developers of the 
                      adaptive learning system with production-ready OAuth authentication.
                  </p>
                  
                  <div style="text-align: center; margin: 2rem 0;">
                      <a href="./app/" style="background: linear-gradient(45deg, #667eea, #764ba2); color: white; padding: 1rem 2rem; border-radius: 50px; text-decoration: none; font-weight: bold; display: inline-block; font-size: 1.1rem; box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);">🚀 Launch App</a>
                  </div>
                  
                  <div class="docs-grid">
                      <a href="./user-manual/" class="doc-card">
                          <span class="doc-icon">👤</span>
                          <h2>User Manual</h2>
                          <p>Learn how to use the Graph Learning System as a learner. Covers account creation with Apple Sign In, training sessions, progress tracking, and all user-facing features.</p>
                      </a>
                      
                      <a href="./admin-manual/" class="doc-card">
                          <span class="doc-icon">⚙️</span>
                          <h2>Administrator Manual</h2>
                          <p>Complete guide for deploying and maintaining the system in production. Includes OAuth setup, security configuration, monitoring, and troubleshooting.</p>
                      </a>
                      
                      <a href="./dev-manual/" class="doc-card">
                          <span class="doc-icon">💻</span>
                          <h2>Developer Manual</h2>
                          <p>Technical documentation for developers. Architecture overview, OAuth implementation details, API reference, testing strategies, and contribution guidelines.</p>
                      </a>
                  </div>
                  
                  <div style="background: #f8f9fa; border-radius: 8px; padding: 2rem; margin: 2rem 0;">
                      <h3 style="margin-top: 0; color: #2c3e50;">🚀 New OAuth Features</h3>
                      <ul style="color: #5a6c7d; line-height: 1.8;">
                          <li><strong>Apple Sign In</strong> - Native iOS integration with App Store compliance</li>
                          <li><strong>GitHub OAuth</strong> - Web authentication for developer accounts</li>
                          <li><strong>JWT Security</strong> - Secure token verification with Apple's JWKS</li>
                          <li><strong>Multi-Provider</strong> - Support for multiple authentication methods</li>
                          <li><strong>Privacy-First</strong> - Handles Apple's private email relay</li>
                      </ul>
                  </div>
                  
                  <div class="footer">
                      <p>Built with ❤️ using Rust, Xilem, and mdBook</p>
                      <p>OAuth Authentication: Apple Sign In + GitHub OAuth</p>
                  </div>
              </div>
          </body>
          </html>
          EOF

      - name: Build User Manual
        run: |
          cd user-manual
          mdbook build
          mv book ../docs-site/user-manual

      - name: Build Admin Manual
        run: |
          cd admin-manual
          mdbook build
          mv book ../docs-site/admin-manual

      - name: Build Developer Manual  
        run: |
          cd dev-manual
          mdbook build
          mv book ../docs-site/dev-manual

      - name: Create CNAME file
        run: echo "abcdeez.fg-goose.online" > docs-site/CNAME

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs-site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4