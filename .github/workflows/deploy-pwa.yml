name: Deploy to GitHub Pages

on:
  push:
    branches: [ main, dev ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          
      - name: Cache Cargo
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
        
      - name: Install mdBook
        run: |
          curl -L https://github.com/rust-lang/mdBook/releases/download/v0.4.40/mdbook-v0.4.40-x86_64-unknown-linux-gnu.tar.gz | tar xz
          sudo mv mdbook /usr/local/bin/
          
      - name: Build PWA
        run: |
          cd xilem-cross-platform/web
          ./build.sh
          
      - name: Build Documentation
        run: |
          cd abs
          mdbook build
          
      - name: Prepare deployment
        run: |
          # Create the deployment directory structure
          mkdir -p _site/app
          mkdir -p _site/docs
          
          # Copy PWA files to the /app subdirectory
          cp -r xilem-cross-platform/web/dist/* _site/app/
          
          # Copy documentation to the /docs subdirectory
          cp -r abs/book/* _site/docs/
          
          # Create a landing page
          cat > _site/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>ABCDeez - Adaptive Learning System</title>
              <style>
                  * {
                      margin: 0;
                      padding: 0;
                      box-sizing: border-box;
                  }
                  body {
                      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
                      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                      min-height: 100vh;
                      display: flex;
                      justify-content: center;
                      align-items: center;
                      padding: 20px;
                  }
                  .container {
                      max-width: 800px;
                      width: 100%;
                      background: rgba(255, 255, 255, 0.95);
                      border-radius: 20px;
                      padding: 60px 40px;
                      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
                      text-align: center;
                  }
                  h1 {
                      color: #333;
                      font-size: 3em;
                      margin-bottom: 20px;
                      background: linear-gradient(135deg, #667eea, #764ba2);
                      -webkit-background-clip: text;
                      -webkit-text-fill-color: transparent;
                      background-clip: text;
                  }
                  .tagline {
                      color: #666;
                      font-size: 1.2em;
                      margin-bottom: 50px;
                  }
                  .links {
                      display: grid;
                      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
                      gap: 20px;
                      margin-bottom: 40px;
                  }
                  .link-card {
                      background: white;
                      border-radius: 12px;
                      padding: 30px 20px;
                      text-decoration: none;
                      color: #333;
                      transition: all 0.3s ease;
                      border: 2px solid transparent;
                      position: relative;
                      overflow: hidden;
                  }
                  .link-card::before {
                      content: '';
                      position: absolute;
                      top: 0;
                      left: 0;
                      right: 0;
                      height: 4px;
                      background: linear-gradient(135deg, #667eea, #764ba2);
                      transform: translateY(-100%);
                      transition: transform 0.3s ease;
                  }
                  .link-card:hover {
                      transform: translateY(-5px);
                      box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
                      border-color: #667eea;
                  }
                  .link-card:hover::before {
                      transform: translateY(0);
                  }
                  .link-card h2 {
                      font-size: 1.5em;
                      margin-bottom: 10px;
                      color: #667eea;
                  }
                  .link-card p {
                      color: #666;
                      font-size: 0.95em;
                      line-height: 1.5;
                  }
                  .icon {
                      font-size: 2.5em;
                      margin-bottom: 15px;
                  }
                  .footer {
                      color: #999;
                      font-size: 0.9em;
                      margin-top: 30px;
                      padding-top: 30px;
                      border-top: 1px solid #e0e0e0;
                  }
                  .footer a {
                      color: #667eea;
                      text-decoration: none;
                  }
                  .footer a:hover {
                      text-decoration: underline;
                  }
                  @media (max-width: 600px) {
                      .container {
                          padding: 40px 20px;
                      }
                      h1 {
                          font-size: 2em;
                      }
                      .links {
                          grid-template-columns: 1fr;
                      }
                  }
              </style>
          </head>
          <body>
              <div class="container">
                  <h1>ABCDeez</h1>
                  <p class="tagline">Adaptive Learning System for Research & Education</p>
                  
                  <div class="links">
                      <a href="/app" class="link-card">
                          <div class="icon">🚀</div>
                          <h2>Launch App</h2>
                          <p>Access the adaptive learning application</p>
                      </a>
                      
                      <a href="/docs" class="link-card">
                          <div class="icon">📚</div>
                          <h2>Documentation</h2>
                          <p>Explore API docs and implementation details</p>
                      </a>
                      
                      <a href="https://github.com/abcdeez/abcdeez" class="link-card">
                          <div class="icon">💻</div>
                          <h2>GitHub</h2>
                          <p>View source code and contribute</p>
                      </a>
                  </div>
                  
                  <div class="footer">
                      <p>Built with Rust, Xilem, and WebAssembly</p>
                      <p>© 2024 ABCDeez Project | <a href="https://github.com/abcdeez/abcdeez/blob/main/LICENSE">MIT License</a></p>
                  </div>
              </div>
          </body>
          </html>
          EOF
          
          # Set domain based on branch
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "abcdeez.fg-goose.online" > _site/CNAME
          elif [ "${{ github.ref }}" = "refs/heads/dev" ]; then
            echo "staging.abcdeez.fg-goose.online" > _site/CNAME
          fi
          
          # Create .nojekyll file to bypass Jekyll processing
          touch _site/.nojekyll
          
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
          
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4