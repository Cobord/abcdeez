name: Release Book Versions

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to build'
        required: true
        type: string

env:
  BOOK_DIR: alphabet-terminal-prototype/book

jobs:
  build-versioned:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Building book for version: ${VERSION}"

      - name: Setup mdBook
        uses: peaceiris/actions-mdbook@v1
        with:
          mdbook-version: 'latest'

      - name: Install dependencies
        run: |
          cargo install mdbook-katex
          cargo install mdbook-toc
          cargo install mdbook-admonish

      - name: Configure book version
        run: |
          cd ${{ env.BOOK_DIR }}
          # Add version to book.toml
          echo "" >> book.toml
          echo "[preprocessor.variables]" >> book.toml
          echo "version = \"${{ steps.version.outputs.version }}\"" >> book.toml

      - name: Build book
        run: |
          cd ${{ env.BOOK_DIR }}
          mdbook build

      - name: Create versioned archive
        run: |
          cd ${{ env.BOOK_DIR }}/build
          tar -czf ../../book-${{ steps.version.outputs.version }}.tar.gz .
          zip -r ../../book-${{ steps.version.outputs.version }}.zip .

      - name: Generate PDF
        uses: docker://pandoc/latex:3
        with:
          args: >-
            --standalone
            --toc
            --toc-depth=2
            --pdf-engine=xelatex
            --from=html
            --to=pdf
            --output=book-${{ steps.version.outputs.version }}.pdf
            ${{ env.BOOK_DIR }}/build/print.html

      - name: Upload release assets
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: |
            book-${{ steps.version.outputs.version }}.tar.gz
            book-${{ steps.version.outputs.version }}.zip
            book-${{ steps.version.outputs.version }}.pdf
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy versioned to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ env.BOOK_DIR }}/build
          destination_dir: ${{ steps.version.outputs.version }}
          keep_files: true

  update-latest:
    needs: build-versioned
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && !github.event.release.prerelease
    steps:
      - uses: actions/checkout@v4

      - name: Setup mdBook
        uses: peaceiris/actions-mdbook@v1
        with:
          mdbook-version: 'latest'

      - name: Install mdbook-katex
        run: cargo install mdbook-katex

      - name: Build latest
        run: |
          cd ${{ env.BOOK_DIR }}
          mdbook build

      - name: Deploy latest to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ env.BOOK_DIR }}/build
          keep_files: false