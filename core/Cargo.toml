[package]
name = "abcdeez-core"
version = { workspace = true }
edition = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
description = "Adaptive graph-coded learning system for cognitive modeling"
repository = "https://github.com/emberian/abcdeez"
homepage = "https://abcdeez.fg-goose.online"
readme = "../README.md"

[package.metadata.wix]
upgrade-guid = "30408D81-5220-499B-A8E2-5B7753E792D2"
path-guid = "8D38F036-1B82-4AC0-AB56-6E023080CBAF"
license = false
eula = false

[lib]
name = "abcdeez_core"
path = "src/lib.rs"

[[bin]]
name = "abcdeez-cli"
path = "src/main.rs"

[dependencies]
serde = { workspace = true, features = ["std"] }
serde_json = { workspace = true }
serde_yaml = "0.9"
rand = { workspace = true }
rand_distr = { workspace = true }
chrono = { workspace = true }
statrs = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
anyhow = "1.0"
toml = "0.8"
sha2 = "0.10"
md5 = "0.7"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, optional = true, features = ["sync", "time", "rt-multi-thread", "macros", "test-util"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
axum = { version = "0.7", optional = true }
tempfile = "3.8"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
proptest = "1.0"
criterion = "0.5"

[features]
default = ["async"]
async = ["tokio"]
backend-server = ["tokio", "axum"]
cli = []
