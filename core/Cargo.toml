[package]
name = "abcdeez-core"
version = { workspace = true }
edition = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
description = "Adaptive graph-coded learning system for cognitive modeling"
repository = "https://github.com/emberian/abcdeez"
homepage = "https://abcdeez.fg-goose.online"
readme = "../README.md"

[lib]
name = "abcdeez_core"
path = "src/lib.rs"

[[bin]]
name = "abcdeez-cli"
path = "src/main.rs"

[dependencies]
crossterm = { version = "0.27", optional = true }
ratatui = { version = "0.26", optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = "0.9"
rand = { workspace = true }
rand_distr = { workspace = true }
chrono = { workspace = true }
statrs = { workspace = true }
uuid = { workspace = true }
tokio = { workspace = true, optional = true, features = ["sync", "time", "rt-multi-thread", "macros", "test-util"] }
tracing = { workspace = true }
anyhow = "1.0"
reqwest = { version = "0.11", features = ["blocking", "json"] }
toml = "0.8"
axum = { version = "0.7", optional = true }
sha2 = "0.10"
md5 = "0.7"
tempfile = "3.8"

[dev-dependencies]
proptest = "1.0"
criterion = "0.5"

[features]
default = ["cli", "async"]
cli = ["crossterm", "ratatui"]
async = ["tokio"]
backend-server = ["tokio", "axum"]
