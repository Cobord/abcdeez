[book]
authors = ["ABCDeez Development Team"]
language = "en"
multilingual = false
src = "src"
title = "ABCDeez Core - Cognitive Assessment & Adaptive Learning System"
description = "Comprehensive documentation for the ABCDeez Core library - a research-grade system for cognitive assessment, adaptive learning, and psychological modeling"

[build]
build-dir = "book"

[preprocessor.mermaid]

[output.html]
default-theme = "navy"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/emberian/abcdeez"
git-repository-icon = "fa-github"
edit-url-template = "https://github.com/emberian/abcdeez//edit/main/core/book/src/{path}"
mathjax-support = true
fold = { enable = true, level = 1 }

[output.html.playground]
editable = false
copyable = true

[output.html.search]
enable = true
limit-results = 30
teaser-word-count = 30
use-boolean-and = true
boost-title = 2
boost-hierarchy = 1
boost-paragraph = 1
expand = true
heading-split-level = 3
copy-js = true
